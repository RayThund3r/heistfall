<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>HEISTFALL</title>
<link rel="stylesheet" href="style.css"></head><body>
<canvas id="c"></canvas><div id="fx"></div>
<div id="h"><div class="bar" id="hp" data-l="HEALTH"><i></i></div><div class="bar" id="al" data-l="ALERT"><i></i></div><div class="bar" id="ab" data-l="PULSE"><i></i></div><div class="bar" id="o2" data-l="OXYGEN"><i></i></div><div class="bar" id="ar" data-l="ARMOR"><i></i></div><div class="bar" id="hu" data-l="HUNGER"><i></i></div><div class="bar" id="th" data-l="THIRST"><i></i></div><div class="bar" id="jf" data-l="JETPACK"><i></i></div><div id="cmp"></div>
<div id="tp"></div><canvas id="mm" class="mm" width="180" height="180"></canvas><div id="bn"></div><div id="cm"></div>
<div id="hl"><kbd>H</kbd> hold for controls</div><div id="help"><b>CONTROLS</b><div class="g"><span>Move</span><kbd>WASD</kbd><span>Look</span><kbd>Mouse</kbd><span>Jump / Swim up</span><kbd>Space</kbd><span>Dash / Nitro</span><kbd>Shift</kbd><span>Interact / Enter / Exit</span><kbd>E</kbd><span>Punch</span><kbd>LMB</kbd><span>Shoot</span><kbd>RMB / G</kbd><span>Reload</span><kbd>R</kbd><span>Dive</span><kbd>C</kbd><span>Phone</span><kbd>P</kbd><span>Map</span><kbd>M</kbd><span>Emote</span><kbd>V</kbd><span>Pulse / Barricade</span><kbd>F / Q</kbd><span>Drive</span><kbd>WASD + Space brake</kbd><span>Pause</span><kbd>Esc</kbd></div></div><div id="dlg"></div><div id="ph"></div><div id="nt"></div></div>
<div id="cb"><i></i><i></i><u>SPACE · next shot</u></div><div id="sub"></div><div id="pm"></div><div id="ov"></div><div id="ft"></div><div id="m"></div>
<script>
const LIBS=[["three.min.js", "https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"], ["CopyShader.js", "https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"], ["LuminosityHighPassShader.js", "https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"], ["EffectComposer.js", "https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"], ["MaskPass.js", "https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/MaskPass.js"], ["ShaderPass.js", "https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"], ["RenderPass.js", "https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"], ["UnrealBloomPass.js", "https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"]];
const ld=u=>new Promise(r=>{const e=document.createElement('script');e.src=u;e.onload=()=>r(1);e.onerror=()=>r(0);document.head.appendChild(e)});
function fail(t){const m=document.getElementById('m');m.style.display='flex';m.innerHTML='<h2>HEISTFALL could not start</h2><pre style="white-space:pre-wrap;max-width:90%;text-align:left">'+t+'</pre>'}
addEventListener('error',e=>{if(window.__booted)return;fail(e.message+' ('+(e.filename||'')+':'+(e.lineno||'?')+')')});
(async()=>{for(const [f,u] of LIBS){if(!await ld('libs/'+f)&&!await ld(u)&&f=='three.min.js'){fail('three.min.js not found. Put it in the libs folder (run get_libs.py) or connect to the internet.');return}}
if(!await ld('game.js')){fail('Missing game file: game.js (it must sit next to index.html)');return}
window.__booted=1})();
</script>
</body></html>
