// ===== roundabouts: curved ring roads with a central island; traffic flows around the island =====
let RBT=[];
function roundabouts(){RBT=[];const cands=[[-18,-18],[54,-54],[54,54],[-54,54],[-54,-54],[18,-90]];const mA=new THREE.MeshStandardMaterial({color:0x2a2d33,roughness:.92,metalness:0,polygonOffset:true,polygonOffsetFactor:-2,polygonOffsetUnits:-2}),mW=new THREE.MeshBasicMaterial({color:0xe8e8e0,side:2,polygonOffset:true,polygonOffsetFactor:-4,polygonOffsetUnits:-4}),mC=MTL(0xb9bbc2,.8,0),mG=MTL(0x3f8f4a,.95,0),mT=MTL(0x6a4a2a,.9,0),mL=MTL(0x2f9e4f,.8,0),mB=new THREE.MeshBasicMaterial({color:0xffd070});
for(const c of cands){if(RBT.length>=3)break;let free=1e9;for(const b of COL){const dx=Math.max(b[0]-c[0],0,c[0]-b[1]),dz=Math.max(b[2]-c[1],0,c[1]-b[3]);free=Math.min(free,Math.hypot(dx,dz))}if(free<10.6)continue;

const d=new THREE.Mesh(new THREE.CircleGeometry(10.4,44),mA);d.rotation.x=-Math.PI/2;d.position.y=.045;g.add(d);
const r1=new THREE.Mesh(new THREE.RingGeometry(10.1,10.4,44),mW);r1.rotation.x=-Math.PI/2;r1.position.y=.05;g.add(r1);
const r2=new THREE.Mesh(new THREE.RingGeometry(7.15,7.3,44,1,0,6.283),new THREE.MeshBasicMaterial({color:0xcfcfc8,side:2,transparent:true,opacity:.55,polygonOffset:true,polygonOffsetFactor:-4,polygonOffsetUnits:-4}));r2.rotation.x=-Math.PI/2;r2.position.y=.05;g.add(r2);
const cb=new THREE.Mesh(new THREE.CylinderGeometry(5.7,5.9,.34,36),mC);cb.position.y=.17;g.add(cb);
const gr=new THREE.Mesh(new THREE.CylinderGeometry(5.2,5.2,.36,36),mG);gr.position.y=.18;g.add(gr);
const tk=new THREE.Mesh(new THREE.CylinderGeometry(.28,.38,2.6,8),mT);tk.position.y=1.6;tk.castShadow=true;g.add(tk);
const cr=new THREE.Mesh(new THREE.SphereGeometry(1.9,12,10),mL);cr.position.y=3.6;cr.scale.y=.85;cr.castShadow=true;g.add(cr);
for(let i=0;i<8;i++){const a=i*Math.PI/4+.39,bo=new THREE.Mesh(new THREE.CylinderGeometry(.11,.11,.7,6),mC);bo.position.set(Math.cos(a)*5.45,.6,Math.sin(a)*5.45);g.add(bo);const bt=new THREE.Mesh(new THREE.SphereGeometry(.13,6,5),mB);bt.position.set(Math.cos(a)*5.45,1.0,Math.sin(a)*5.45);g.add(bt)}
W.add(g);RBT.push({x:c[0],z:c[1],R:7.6,g});
VH.forEach(v=>{if(!v.ai&&!v.hangar&&Math.hypot(v.m.position.x-c[0],v.m.position.z-c[1])<12){v.m.position.z+=(v.m.position.z>=c[1]?1:-1)*(16-Math.abs(v.m.position.z-c[1]))}})}}
function rbDetour(v,dt){const p=v.m.position,ax=v.ax,o=ax=='x'?'z':'x';let dl=v.dl||0;p[o]-=dl;let nd=0;
for(const rb of RBT){const a=p[ax]-(ax=='x'?rb.x:rb.z),lt=p[o]-(o=='x'?rb.x:rb.z),Rl=17;if(Math.abs(a)<Rl&&Math.abs(lt)<rb.R){const w=.5*(1+Math.cos(Math.PI*a/Rl)),sg=lt>=0?1:-1,m=Math.abs(lt)+(rb.R-Math.abs(lt))*w;nd=sg*m-lt;break}}
p[o]+=nd;if(nd!==0||dl!==0){const dlat=nd-dl,fw=v.dir*v.sp*dt;if(nd!==0)v.h=ax=='z'?Math.atan2(dlat,fw):Math.atan2(fw,dlat);else v.h=ax=='z'?(v.dir>0?0:Math.PI):(v.dir>0?Math.PI/2:-Math.PI/2)}v.dl=nd}
const _clrIn=()=>{for(const k in keys)keys[k]=0;MH=0;TJ.x=TJ.y=0};addEventListener('blur',_clrIn);document.addEventListener('visibilitychange',()=>{if(document.hidden)_clrIn()});
